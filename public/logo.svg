<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#1E40AF" opacity="0.1"/>
  
  <!-- Main Road -->
  <path d="M 60 140 L 60 80 Q 60 60 80 60 L 120 60 Q 140 60 140 80 L 140 140" 
        stroke="#1E40AF" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Road Divider Lines -->
  <line x1="100" y1="70" x2="100" y2="85" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="95" x2="100" y2="110" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="100" y2="135" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Traffic Light -->
  <rect x="75" y="35" width="18" height="45" rx="4" fill="#374151"/>
  <circle cx="84" cy="47" r="5" fill="#DC2626"/>
  <circle cx="84" cy="60" r="5" fill="#FBBF24"/>
  <circle cx="84" cy="73" r="5" fill="#10B981" opacity="0.3"/>
  
  <!-- AI Eye/Camera -->
  <circle cx="130" cy="50" r="20" fill="#FFFFFF" stroke="#1E40AF" stroke-width="3"/>
  <circle cx="130" cy="50" r="12" fill="#1E40AF"/>
  <circle cx="130" cy="50" r="6" fill="#60A5FA"/>
  <circle cx="127" cy="47" r="3" fill="#FFFFFF"/>
  
  <!-- Scan Lines (AI Vision Effect) -->
  <line x1="110" y1="50" x2="90" y2="50" stroke="#60A5FA" stroke-width="2" opacity="0.6" stroke-dasharray="2,2"/>
  <line x1="150" y1="50" x2="170" y2="50" stroke="#60A5FA" stroke-width="2" opacity="0.6" stroke-dasharray="2,2"/>
  <line x1="130" y1="30" x2="130" y2="10" stroke="#60A5FA" stroke-width="2" opacity="0.6" stroke-dasharray="2,2"/>
  
  <!-- Vehicle Silhouette -->
  <g transform="translate(85, 95)">
    <!-- Motorcycle -->
    <ellipse cx="5" cy="18" rx="5" ry="5" fill="#374151"/>
    <ellipse cx="25" cy="18" rx="5" ry="5" fill="#374151"/>
    <path d="M 10 18 L 15 10 L 20 10 L 20 18" stroke="#374151" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="17" cy="8" r="3" fill="#374151"/>
  </g>
  
  <!-- Shield (Safety Symbol) -->
  <path d="M 40 115 L 40 100 Q 40 95 45 95 L 55 95 Q 60 95 60 100 L 60 115 Q 50 125 50 125 Q 40 115 40 115 Z" 
        fill="#10B981" opacity="0.8"/>
  <path d="M 45 107 L 48 110 L 54 102" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Corner Brackets (Vision Frame) -->
  <path d="M 30 30 L 30 40 M 30 30 L 40 30" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 170 30 L 170 40 M 170 30 L 160 30" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 30 170 L 30 160 M 30 170 L 40 170" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 170 170 L 170 160 M 170 170 L 160 170" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>